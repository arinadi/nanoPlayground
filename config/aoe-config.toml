# Default config for nanoPlayground.
# Docker-in-Docker/sandbox is NOT enabled — this image ITSELF already is the
# "sandbox" (a container), so aoe must not spawn another container inside
# (especially when the host runs via proot, which usually has no
# Docker/Podman daemon at all).

[sandbox]
enabled_by_default = false

[session]
# Set to true to auto-skip permission prompts for all new sessions
# (equivalent of --dangerously-skip-permissions / opencode auto-approve).
# Default false = keep the approval prompts as usual.
yolo_mode_default = false
