# Default config untuk nanoPlayground.
# Docker-in-Docker/sandbox TIDAK diaktifkan — image ini SENDIRI sudah
# menjadi "sandbox"-nya (kontainer), jadi tidak perlu aoe membuat container
# lagi di dalam container (apalagi kalau host-nya jalan lewat proot,
# yang biasanya tidak punya Docker/Podman daemon sama sekali).

[sandbox]
enabled_by_default = false

[session]
# Set ke true kalau mau semua sesi baru otomatis skip permission-prompt
# (setara --dangerously-skip-permissions / opencode auto-approve).
# Defaultnya false = tetap ada approval prompt seperti biasa.
yolo_mode_default = false
