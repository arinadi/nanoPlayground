name: Publish to GHCR

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Ubuntu (default, :latest) ---
      - name: Meta ubuntu
        id: meta_ubuntu
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=ubuntu,enable={{is_default_branch}}
            type=sha,prefix=ubuntu-
            type=ref,event=tag
            type=ref,event=branch

      - name: Build & push ubuntu
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta_ubuntu.outputs.tags }}
          labels: ${{ steps.meta_ubuntu.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Void variant (:void) ---
      - name: Meta void
        id: meta_void
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=void,enable={{is_default_branch}}
            type=sha,prefix=void-
            type=ref,event=tag,suffix=-void
            type=ref,event=branch,suffix=-void

      - name: Build & push void
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.void
          push: true
          tags: ${{ steps.meta_void.outputs.tags }}
          labels: ${{ steps.meta_void.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
